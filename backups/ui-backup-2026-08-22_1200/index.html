<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf2f6" />
    <title>Dayflow HRMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>

<body>

            </div>

            <nav class="sidebar-nav" aria-label="Sidebar navigation">
                <button class="nav-item" type="button" data-view="dashboard">

                    <span class="nav-icon">✦</span>

                <button class="nav-item" type="button" data-view="payroll">
