<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Desk | Dayflow</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/dashboard.css"></head>
<body><div class="app"><aside class="sidebar"><a class="brand" href="/admin-spa"><b class="brand-mark">d</b><span>dayflow<i>.</i></span></a><p class="nav-label">Management</p><nav class="nav"><button class="active" data-view="overview"><span class="nav-icon">⌂</span><span>Overview</span></button><button data-view="people"><span class="nav-icon">♙</span><span>People</span></button><button data-view="leaves"><span class="nav-icon">↗</span><span>Leave approvals</span></button><button data-view="payroll"><span class="nav-icon">▤</span><span>Payroll control</span></button></nav><div class="side-user"><span class="avatar">HR</span><div><strong>HR workspace</strong><small>Administrator</small></div></div></aside><main class="main"><header class="topbar"><div class="crumb">Workspace / <strong id="crumb">Overview</strong></div><div class="top-actions"><span class="date-label" id="today"></span><button class="logout" id="logout">Log out</button></div></header><div class="content" id="content"></div></main></div>
<script>
const content=document.getElementById('content'),today=new Date();document.getElementById('today').textContent=today.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});let users=[],leaves=[],attendance={};async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});if(!r.ok)throw r;return r.json()}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function status(v){return `<span class="status ${String(v).toLowerCase()}">${esc(v)}</span>`}function shell(t,d,b){content.innerHTML=`<section class="page-heading"><div><p class="eyebrow">ADMIN / HR DESK</p><h1>${t}</h1><p>${d}</p></div><button class="primary" id="new-user">+ New employee</button></section>${b}`}function nav(){document.querySelectorAll('[data-view-link]').forEach(x=>x.onclick=e=>{e.preventDefault();show(x.dataset.viewLink)})}
function renderOverview(){const present=Object.values(attendance).flat().filter(x=>x.date===today.toISOString().slice(0,10)).length;const pending=leaves.flatMap(x=>x).filter(x=>x.status==='Pending').length;shell('Good morning, HR team.','A clear view of people operations across Dayflow.',`<div class="metric-grid"><article class="metric"><span>Total employees</span><strong>${users.length}</strong><small>Active records</small></article><article class="metric"><span>Present today</span><strong>${present}</strong><small>Live attendance</small></article><article class="metric"><span>Pending leaves</span><strong>${pending}</strong><small>Needs your review</small></article></div><div class="section-grid"><section class="panel"><div class="panel-head"><div><h2>People at a glance</h2><p>Current employee directory</p></div><button class="secondary" data-view-link="people">Manage people</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Employee</th><th>Role</th><th>Department</th><th>Status</th></tr></thead><tbody>${users.slice(0,5).map(u=>`<tr><td>${esc(u.profile?.name||u.email)}</td><td>${esc(u.role)}</td><td>${esc(u.profile?.department||'--')}</td><td>${status(u.active===false?'Absent':'Present')}</td></tr>`).join('')||'<tr><td class="empty" colspan="4">No employees found.</td></tr>'}</tbody></table></div></section><section class="panel"><div class="panel-head"><div><h2>Approval queue</h2><p>Time off waiting for review</p></div><button class="secondary" data-view-link="leaves">Open queue</button></div><div class="approval-list">${leaves.flatMap(x=>x).filter(x=>x.status==='Pending').slice(0,3).map(x=>`<div class="approval"><div><strong>${esc(x.type)} leave</strong><span>${esc(x.from)} - ${esc(x.to)}</span></div>${status('Pending')}</div>`).join('')||'<div class="empty">Everything is up to date.</div>'}</div></section></div>`);nav();document.getElementById('new-user').onclick=()=>show('people')}
function renderPeople(){shell('People','Search, review, and manage your employee directory.',`<section class="panel"><div class="toolbar"><div><h2>Employee directory</h2><p style="margin:5px 0 0;color:var(--muted);font-size:11px">${users.length} records in this workspace</p></div><input class="table-search" id="search" placeholder="Search by name or email"></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Employee</th><th>Email</th><th>Role</th><th>Department</th><th>Actions</th></tr></thead><tbody id="people-body">${peopleRows(users)}</tbody></table></div></section>`);nav();document.getElementById('new-user').onclick=()=>alert('Use the employee provisioning workflow to create an account.');document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();document.getElementById('people-body').innerHTML=peopleRows(users.filter(u=>(u.email+ (u.profile?.name||'')).toLowerCase().includes(q)))} }function peopleRows(list){return list.map(u=>`<tr><td>${esc(u.profile?.name||'--')}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${esc(u.profile?.department||'--')}</td><td><div class="action-row"><button onclick="viewUser('${encodeURIComponent(u.email)}')">View</button><button onclick="editUser('${encodeURIComponent(u.email)}')">Edit</button><button class="danger" onclick="deactivate('${encodeURIComponent(u.email)}')">Deactivate</button></div></td></tr>`).join('')||'<tr><td class="empty" colspan="5">No matching employees.</td></tr>'}
+async function viewUser(email){try{const u=await api('/api/admin/users/'+email);alert(JSON.stringify(u,null,2))}catch(_){alert('Unable to load employee')}}async function editUser(email){const role=prompt('Update role: employee or hr','employee');if(role==='employee'||role==='hr'){try{await api('/api/admin/users/'+email+'/update',{method:'POST',body:JSON.stringify({role})});await load();show('people')}catch(_){alert('Unable to update employee')}}}async function deactivate(email){if(!confirm('Deactivate this account?'))return;try{await api('/api/admin/users/'+email+'/deactivate',{method:'POST'});await load();show('people')}catch(_){alert('Unable to deactivate account')}}
+function renderLeaves(){shell('Leave approvals','Review employee time-off requests and keep decisions moving.',`<section class="panel"><div class="panel-head"><div><h2>Approval queue</h2><p>Approve or reject requests with a clear audit trail.</p></div><span class="status pending">${leaves.flatMap(x=>x).filter(x=>x.status==='Pending').length} pending</span></div><div class="approval-list">${leaves.flatMap((items,emailIndex)=>items.map(x=>({...x,email:users[emailIndex]?.email||'Employee'}))).map(x=>`<article class="approval"><div><strong>${esc(x.email)}</strong><span>${esc(x.type)} · ${esc(x.from)} to ${esc(x.to)}</span><small>${esc(x.remarks||'No remarks added.')}</small></div><div class="approval-actions"><button onclick="decide('${encodeURIComponent(x.email)}','${esc(x.id)}','Approved')">Approve</button><button class="reject" onclick="decide('${encodeURIComponent(x.email)}','${esc(x.id)}','Rejected')">Reject</button></div></article>`).join('')||'<div class="empty">No leave requests have been submitted.</div>'}</div></section>`);nav();document.getElementById('new-user').onclick=()=>show('people')}
	async function decide(email,id,decision){const comment=prompt('Add an administrative comment (optional):','')||'';try{await api('/api/admin/leave/'+email+'/'+encodeURIComponent(id)+'/decision',{method:'POST',body:JSON.stringify({status:decision,comment})});await load();show('leaves')}catch(_){alert('Unable to save this decision')}}
+async function load(){try{users=await api('/api/admin/users');attendance=await api('/api/admin/attendance');leaves=Object.values(await api('/api/admin/leave/requests'))}catch(_){users=[];attendance={};leaves=[]}}function show(v){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('crumb').textContent={overview:'Overview',people:'People',leaves:'Leave approvals',payroll:'Payroll control'}[v]||'Overview';({overview:renderOverview,people:renderPeople,leaves:renderLeaves,payroll:renderPayroll}[v]||renderOverview)()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));document.getElementById('logout').onclick=()=>{document.cookie='session=; Path=/; Max-Age=0';location='/'};load().then(()=>show('overview'));
+</script></body></html>
