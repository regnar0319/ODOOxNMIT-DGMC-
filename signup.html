<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | Dayflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#18221d; --muted:#748078; --line:#d9e5dc; --paper:#f5f8f4; --surface:#fff; --green:#1f6046; --green-dark:#164b36; --lime:#d8ef83; --coral:#df8a68; --error:#c94f4f; --success:#287c58; --shadow:0 24px 70px rgba(22,75,54,.12); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family:"Manrope",Arial,sans-serif; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.45; background-image:linear-gradient(rgba(31,96,70,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(31,96,70,.045) 1px,transparent 1px); background-size:34px 34px; }
    .page { position:relative; width:min(100% - 48px, 980px); min-height:100vh; margin:auto; padding:38px 0 45px; }
    .title { margin:0 0 18px 8px; color:var(--green-dark); font-size:clamp(26px,3vw,34px); font-weight:800; letter-spacing:-1.2px; }
    .title::before { content:""; display:inline-block; width:9px; height:9px; margin:0 11px 5px 0; border-radius:3px 3px 3px 0; background:var(--coral); }
    .signup-shell { position:relative; min-height:calc(100vh - 130px); border:1px solid #c8d8cc; border-radius:14px; padding:34px clamp(30px,8vw,105px) 38px; background:rgba(255,255,255,.88); box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden; }
    .signup-shell::after { content:""; position:absolute; width:330px; height:330px; right:-190px; bottom:-160px; border:1px solid rgba(31,96,70,.13); border-radius:50%; pointer-events:none; }
    .logo { width:min(100%,470px); margin:0 auto 55px; padding:19px 20px; border:1px solid rgba(216,239,131,.24); border-radius:10px; color:#fff; background:var(--green-dark); text-align:center; font:800 25px "Manrope",sans-serif; letter-spacing:-1.5px; box-shadow:0 12px 25px rgba(22,75,54,.14); }
    .logo::first-letter { color:var(--lime); }
    form { position:relative; z-index:1; width:min(100%,700px); margin:auto; display:grid; gap:17px; }
    .field { display:grid; grid-template-columns:minmax(190px,245px) 1fr; align-items:center; gap:18px; }
    label { color:var(--ink); font-size:14px; font-weight:800; letter-spacing:-.2px; }
    .control { display:flex; align-items:center; min-width:0; min-height:48px; border:1px solid var(--line); border-radius:8px; background:var(--surface); transition:border-color .2s,box-shadow .2s; }
    .control:focus-within { border-color:var(--green); box-shadow:0 0 0 3px rgba(31,96,70,.11); }
    input { width:100%; min-width:0; padding:13px 14px; border:0; outline:0; color:var(--ink); background:transparent; font:14px "Manrope",sans-serif; }
    input::placeholder { color:#a4b0a8; }
    .toggle { width:44px; height:46px; flex:0 0 44px; border:0; color:var(--muted); background:transparent; cursor:pointer; font-size:17px; }
    .toggle:hover,.toggle:focus-visible { color:var(--green); }
    .upload { width:44px; height:46px; flex:0 0 44px; border:0; border-left:1px solid var(--line); border-radius:0 7px 7px 0; color:var(--green-dark); background:#eef7e5; cursor:pointer; font-size:21px; }
    .upload:hover { color:#fff; background:var(--green); }
    .logo-preview { width:30px; height:30px; margin-right:8px; border-radius:5px; object-fit:cover; display:none; }
    .logo-preview.visible { display:block; }
    .message { grid-column:2; min-height:15px; margin:-11px 0 0; color:var(--error); font:11px "Manrope",sans-serif; font-weight:600; }
    .message:empty { display:none; }
    .message.success { color:var(--success); }
    .actions { margin-top:24px; }
    .submit { width:100%; min-height:52px; border:0; border-radius:8px; color:#fff; background:var(--green); cursor:pointer; font:800 14px "Manrope",sans-serif; box-shadow:0 9px 18px rgba(31,96,70,.18); transition:background .2s,transform .2s,box-shadow .2s; }
    .submit:hover { background:var(--green-dark); transform:translateY(-1px); box-shadow:0 12px 22px rgba(31,96,70,.23); }
    .submit:active { transform:translateY(0); }
    .submit:disabled { opacity:.65; cursor:wait; }
    .login { position:relative; z-index:1; margin:30px 0 0; text-align:center; color:var(--muted); font-size:13px; }
    a { color:var(--green); font-weight:800; text-decoration:none; } a:hover { color:var(--green-dark); text-decoration:underline; }
    @media (max-width:650px) {
      .page { width:min(100% - 24px, 850px); padding-top:22px; }
      .title { margin-left:2px; }
      .signup-shell { min-height:calc(100vh - 88px); padding:24px 18px 28px; }
      .logo { margin-bottom:38px; }
      form { gap:15px; }
      .field { grid-template-columns:1fr; gap:5px; }
      label { font-size:13px; }
      .message { grid-column:1; margin:0; }
      .actions { margin-top:15px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="title">Sign Up Page</h1>
    <section class="signup-shell" aria-labelledby="signup-heading">
      <div class="logo" id="signup-heading">dayflow.</div>
      <form id="signup-form" novalidate>
        <div class="field"><label for="company">Company Name</label><div class="control"><input id="company" name="company" type="text" autocomplete="organization" placeholder="Enter company name" required><img class="logo-preview" id="logo-preview" alt="Company logo preview"><button class="upload" id="upload-button" type="button" aria-label="Upload company logo">&#8593;</button><input id="logo-input" type="file" accept="image/png,image/jpeg,image/webp" hidden></div><p class="message" id="company-message"></p></div>
        <div class="field"><label for="name">Name</label><div class="control"><input id="name" name="name" type="text" autocomplete="name" placeholder="Enter your full name" required></div><p class="message" id="name-message"></p></div>
        <div class="field"><label for="email">Email</label><div class="control"><input id="email" name="email" type="email" autocomplete="email" placeholder="Enter your email" required></div><p class="message" id="email-message"></p></div>
        <div class="field"><label for="phone">Phone</label><div class="control"><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="Enter your phone number" pattern="[+0-9()\\-\\s]{7,20}" required></div><p class="message" id="phone-message"></p></div>
        <div class="field"><label for="password">Password</label><div class="control"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="Enter your password" required><button class="toggle" type="button" data-toggle="password" aria-label="Show password">&#9673;</button></div><p class="message" id="password-message"></p></div>
        <div class="field"><label for="confirm-password">Confirm Password</label><div class="control"><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" placeholder="Confirm your password" required><button class="toggle" type="button" data-toggle="confirm-password" aria-label="Show confirm password">&#9673;</button></div><p class="message" id="confirm-password-message"></p></div>
        <p class="message" id="form-message" role="alert"></p>
        <div class="actions"><button class="submit" id="submit-button" type="submit">Sign Up</button></div>
      </form>
      <p class="login">Already have an account? <a href="/">Sign In</a></p>
    </section>
  </main>
  <script>
    const form = document.getElementById('signup-form');
    const fields = ['company', 'name', 'email', 'phone', 'password', 'confirm-password'];
    const message = (id, text) => { const target = document.getElementById(id + '-message'); target.textContent = text; target.classList.toggle('success', id === 'form' && Boolean(text) && text.startsWith('Account created')); };
    const logoInput = document.getElementById('logo-input');
    const logoPreview = document.getElementById('logo-preview');
    document.getElementById('upload-button').addEventListener('click', () => logoInput.click());
    logoInput.addEventListener('change', () => {
      const file = logoInput.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) { message('company', 'Company logo must be 2 MB or smaller.'); logoInput.value = ''; return; }
      logoPreview.src = URL.createObjectURL(file);
      logoPreview.classList.add('visible');
      message('company', '');
    });
    document.querySelectorAll('[data-toggle]').forEach((button) => button.addEventListener('click', () => {
      const input = document.getElementById(button.dataset.toggle);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      button.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    }));
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      fields.forEach((id) => message(id, ''));
      message('form', '');
      const values = Object.fromEntries(new FormData(form).entries());
      let valid = true;
      if (!values.company.trim()) { message('company', 'Please enter your company name.'); valid = false; }
      if (!values.name.trim()) { message('name', 'Please enter your name.'); valid = false; }
      if (!values.phone.trim() || !form.phone.validity.valid) { message('phone', 'Please enter a valid phone number.'); valid = false; }
      if (!values.email.trim() || !form.email.validity.valid) { message('email', 'Please enter a valid email address.'); valid = false; }
      if (!/(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,}/.test(values.password)) { message('password', 'Password must contain at least 8 characters, uppercase, lowercase, number, and special character.'); valid = false; }
      if (values.password !== values.confirm_password) { message('confirm-password', 'Passwords do not match.'); valid = false; }
      if (!valid) return;
      const submit = document.getElementById('submit-button');
      submit.disabled = true; submit.textContent = 'Creating Account...';
      try {
        const response = await fetch('/api/signup', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(values) });
        const result = await response.json();
        if (!response.ok) message('form', result.error || result.detail || 'Unable to create your account.');
        else { message('form', result.message || 'Account created successfully. Please verify your email to continue.'); form.reset(); }
      } catch (_) { message('form', 'Unable to sign up right now. Please try again.'); }
      finally { submit.disabled = false; submit.textContent = 'Sign Up'; }
    });
  </script>
</body>
</html>
