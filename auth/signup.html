<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign Up — Dayflow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --df-green: #144a37;
            --df-cream: #f5f7f4
        }

        body {
            background: var(--df-cream);
            font-family: Inter, system-ui
        }
    </style>
</head>

<body class="min-h-screen grid grid-cols-1 lg:grid-cols-12">
    <aside class="hidden lg:block lg:col-span-5 bg-[#11472f] text-white p-12">
        <div class="max-w-md">
            <h2 class="text-3xl font-serif mb-2">Create your account</h2>
            <p class="opacity-90">Sign up and verify your email to get secure access to employee tools, time tracking
                and payroll.</p>
        </div>
    </aside>
    <main class="col-span-1 lg:col-span-7 flex items-center justify-center p-8">
        <div class="w-full max-w-md">
            <form id="signup" class="bg-white rounded-lg shadow p-6 space-y-4" onsubmit="return false;"><label
                    class="block text-sm">Employee ID<input id="emp"
                        class="mt-2 w-full rounded border px-3 py-2"></label><label class="block text-sm">Email<input
                        id="email" type="email" class="mt-2 w-full rounded border px-3 py-2"></label><label
                    class="block text-sm">Password<input id="password" type="password"
                        class="mt-2 w-full rounded border px-3 py-2"></label><button id="create"
                    class="w-full py-3 rounded bg-[#11472f] text-white">Create account</button>
                <p class="text-center text-sm text-slate-500">Already registered? <a href="/auth/signin.html"
                        class="text-emerald-700">Sign in</a></p>
            </form>
        </div>
    </main>
    <script>document.getElementById('signup').addEventListener('submit', async (e) => { e.preventDefault(); const payload = { employee_id: document.getElementById('emp').value, email: document.getElementById('email').value, password: document.getElementById('password').value }; try { const res = await fetch('/api/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); if (res.ok) { alert('Account created — check email'); location = '/auth/signin.html'; } else { alert('Unable to create account') } } catch (err) { alert('Network error') } })</script>
</body>

</html>
