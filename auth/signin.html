<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign In — Dayflow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --df-green: #144a37;
            --df-cream: #f5f7f4
        }

        body {
            background: var(--df-cream);
            font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto
        }
    </style>
</head>

<body class="min-h-screen grid grid-cols-1 lg:grid-cols-12">
    <aside class="hidden lg:block lg:col-span-5 bg-[#11472f] text-white p-12">
        <div class="max-w-md">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-10 h-10 bg-emerald-300 rounded flex items-center justify-center font-bold text-green-900">
                    d</div>
                <div>
                    <h1 class="text-2xl font-extrabold">Dayflow</h1>
                    <p class="text-sm opacity-90">Human Resource Management</p>
                </div>
            </div>
            <h2 class="text-4xl font-serif mb-4">Every workday, perfectly aligned.</h2>
            <p class="opacity-90">A calmer, clearer way to keep your people moving forward.</p>
        </div>
    </aside>

    <main class="col-span-1 lg:col-span-7 flex items-center justify-center p-8">
        <div class="w-full max-w-md">
            <h2 class="text-3xl font-serif mb-2">Welcome Back</h2>
            <p class="text-sm text-slate-600 mb-6">Sign in to continue to your Dayflow workspace.</p>
            <form id="signin" class="bg-white rounded-lg shadow p-6 space-y-4" onsubmit="return false;">
                <label class="block text-sm">Email<input id="email" type="email" required
                        class="mt-2 w-full rounded border px-3 py-2" placeholder="Enter your email"></label>
                <label class="block text-sm">Password<input id="password" type="password" required
                        class="mt-2 w-full rounded border px-3 py-2" placeholder="Enter your password"></label>
                <div class="flex items-center justify-between"><label class="text-sm"><input type="checkbox"
                            id="remember"> Remember me</label><a href="#" class="text-sm text-emerald-700">Forgot?</a>
                </div>
                <button id="submit" class="w-full py-3 rounded bg-[#11472f] text-white">Sign In</button>
                <p class="text-center text-sm text-slate-500">Don't have an account? <a href="/auth/signup.html"
                        class="text-emerald-700">Sign Up</a></p>
            </form>
        </div>
    </main>
    <script>
        document.getElementById('signin').addEventListener('submit', async (e) => { e.preventDefault(); const payload = { email: document.getElementById('email').value, password: document.getElementById('password').value }; try { const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); if (res.ok) { const d = await res.json().catch(() => ({})); window.location.href = d.redirect || '/employee-dashboard.html'; } else { alert('Invalid credentials') } } catch (err) { alert('Network error') } })
    </script>
</body>

</html>
