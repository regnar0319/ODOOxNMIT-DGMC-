<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | Dayflow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>

<body data-page="signin">
    <main class="auth-shell">
        <aside class="brand-panel">
            <div class="brand"><span class="brand-mark" aria-hidden="true">d</span><span>dayflow.</span></div>
            <div class="brand-content">
                <p class="eyebrow">Human resource management</p>
                <h1>Every workday, perfectly aligned.</h1>
                <p class="brand-copy">One workspace for your people, attendance and time off.</p>
                <div class="abstract-visual" aria-hidden="true"><i class="orbit orbit-a"></i><i
                        class="orbit orbit-b"></i></div>
            </div>
            <div class="brand-footer"><i></i><span>Built for calm, capable teams</span></div>
        </aside>
        <section class="auth-panel" aria-labelledby="auth-title">
            <div class="form-wrap">
                <header class="form-header">
                    <p class="eyebrow" style="color:var(--green-800)">Welcome back</p>
                    <h2 id="auth-title">Sign in to Dayflow</h2>
                    <p>Sign in to continue to your Dayflow workspace.</p>
                </header>
                <div class="auth-card">
                    <form class="auth-form" novalidate>
                        <div class="field"><label for="email">Email</label>
                            <div class="input-wrap"><span class="input-icon" aria-hidden="true">@</span><input
                                    id="email" name="email" type="email" autocomplete="email"
                                    placeholder="Enter your work email" required></div>
                            <p class="field-error" aria-live="polite"></p>
                        </div>
                        <div class="field"><label for="password">Password</label>
                            <div class="input-wrap"><span class="input-icon" aria-hidden="true">*</span><input
                                    id="password" name="password" type="password" autocomplete="current-password"
                                    placeholder="Enter your password" required><button class="password-toggle"
                                    type="button" data-target="password" aria-label="Show password">Show</button></div>
                            <p class="field-error" aria-live="polite"></p>
                        </div>
                        <div class="form-row"><a class="text-link" href="#" data-forgot>Forgot password?</a></div>
                        <div class="form-status" data-status role="alert" aria-live="polite"></div>
                        <button class="primary-action" type="submit">Sign In</button>
                    </form>
                </div>
                <p class="auth-switch">Don't have an account? <a class="text-link" href="signup.html">Sign Up</a></p>
            </div>
        </section>
    </main>
    <script src="auth.js" defer></script>
</body>

</html>
