<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Desk | Dayflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/dashboard.css">
<style>
body {
	background:
		radial-gradient(circle at 88% 8%, rgba(216, 239, 131, .38), transparent 25%),
		radial-gradient(circle at 8% 92%, rgba(31, 96, 70, .16), transparent 30%),
		radial-gradient(circle at 55% 42%, rgba(223, 138, 104, .10), transparent 24%),
		radial-gradient(circle at 30% 12%, rgba(83, 141, 185, .10), transparent 22%),
		linear-gradient(135deg, #edf7ef 0%, #fbfcf9 48%, #e9f2ed 100%);
}
body::before {
	content: "";
	position: fixed;
	inset: 0;
	z-index: -1;
	pointer-events: none;
	opacity: .32;
	background-image: linear-gradient(rgba(31, 96, 70, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(31, 96, 70, .05) 1px, transparent 1px);
	background-size: 36px 36px;
}
</style>
</head>
<body><div class="app"><aside class="sidebar"><a class="brand" href="/employee-spa"><b class="brand-mark">d</b><span>dayflow<i>.</i></span></a><p class="nav-label">Workspace</p><nav class="nav"><button class="active" data-view="overview"><span class="nav-icon">⌂</span><span>Overview</span></button><button data-view="attendance"><span class="nav-icon">◷</span><span>Attendance</span></button><button data-view="leave"><span class="nav-icon">↗</span><span>Time off</span></button><button data-view="payroll"><span class="nav-icon">▤</span><span>Payroll</span></button></nav><div class="side-user"><span class="avatar" id="side-avatar">AE</span><div><strong id="side-name">Employee</strong><small>Employee account</small></div></div></aside><main class="main"><header class="topbar"><div class="crumb">Workspace / <strong id="crumb">Overview</strong></div><div class="top-actions"><span class="date-label" id="today"></span><button class="logout" id="logout">Log out</button></div></header><div class="content" id="content"></div></main></div>
<script>
const content=document.getElementById('content'),today=new Date();document.getElementById('today').textContent=today.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});let profile={name:'Employee',email:'',payroll:{}},attendance=[],leaves=[],clockedIn=false,clockStart=null;
async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});if(!r.ok)throw r;return r.json()}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function initials(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()||'AE'}function status(v){return `<span class="status ${String(v).toLowerCase()}">${esc(v)}</span>`}function shell(t,d,b){content.innerHTML=`<section class="page-heading"><div><p class="eyebrow">EMPLOYEE DESK</p><h1>${t}</h1><p>${d}</p></div></section>${b}`}function links(){document.querySelectorAll('[data-view-link]').forEach(x=>x.onclick=e=>{e.preventDefault();show(x.dataset.viewLink)})}
function renderOverview(){shell(`Good morning, ${esc(profile.name.split(' ')[0])}.`,'Here is your workday at a glance.',`<div class="hero"><section class="welcome"><h2>Keep your day moving.</h2><p>Stay on top of attendance, time off, and everything that helps you do your best work.</p><div class="welcome-meta"><span><strong>${attendance.length}</strong>days tracked</span><span><strong>${leaves.filter(x=>x.status==='Pending').length}</strong>pending requests</span></div></section><section class="profile-card"><span class="avatar">${esc(initials(profile.name))}</span><div><strong>${esc(profile.name)}</strong><span>${esc(profile.email)}</span><a href="#" data-view-link="profile">View profile →</a></div></section></div><div class="shortcut-grid"><button class="shortcut" data-view-link="profile"><span class="shortcut-icon">◎</span><span><strong>My profile</strong><span>Personal details</span></span></button><button class="shortcut" data-view-link="attendance"><span class="shortcut-icon">◷</span><span><strong>Attendance</strong><span>Track your hours</span></span></button><button class="shortcut" data-view-link="leave"><span class="shortcut-icon">↗</span><span><strong>Leave requests</strong><span>Apply or review time off</span></span></button></div><div class="section-grid"><section class="panel"><div class="panel-head"><div><h2>Attendance</h2><p>Today, ${today.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</p></div><div class="segmented"><button class="active">Daily</button><button data-view-link="attendance">Weekly</button></div></div><div class="attendance-top"><div class="attendance-state"><strong id="timer">00:00:00</strong><span>${clockedIn?'Currently working':'Ready to start your day'}</span></div><button class="attendance-btn ${clockedIn?'checkout':''}" id="clock">${clockedIn?'Check Out':'Check In'}</button></div><div class="bars"><i class="bar" style="height:38%"></i><i class="bar" style="height:65%"></i><i class="bar" style="height:55%"></i><i class="bar current" style="height:78%"></i><i class="bar" style="height:48%"></i><i class="bar" style="height:68%"></i><i class="bar" style="height:42%"></i></div><div class="bar-labels"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div></section><section class="panel"><div class="panel-head"><div><h2>Recent time off</h2><p>Your latest requests</p></div><button class="secondary" data-view-link="leave">View all</button></div><div class="table-wrap"><table class="data-table"><tbody>${leaves.slice(-3).reverse().map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.from||'')}</td><td>${status(x.status)}</td></tr>`).join('')||'<tr><td class="empty">No leave requests yet.</td></tr>'}</tbody></table></div></section></div>`);links();document.getElementById('clock').onclick=toggleClock;updateTimer()}
function formatDate(value){return value?new Date(`${value}T00:00:00`).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'--'}
function formatTime(value){return value?new Date(value).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}):'--'}
function duration(checkin,checkout){if(!checkin)return 0;const end=checkout?new Date(checkout):new Date();return Math.max(0,(end-new Date(checkin))/3600000)}
function hours(value){return `${value.toFixed(2)}h`}
function attendanceRows(mode='weekly',from='',to='',selectedStatus='all'){const now=new Date();const weekStart=new Date(now);weekStart.setDate(now.getDate()-((now.getDay()+6)%7));weekStart.setHours(0,0,0,0);return attendance.filter(item=>{const date=new Date(`${item.date}T00:00:00`);const inRange=from?date>=new Date(`${from}T00:00:00`):true;const beforeTo=to?date<=new Date(`${to}T23:59:59`):true;const inWeek=mode==='weekly'?date>=weekStart:true;return inRange&&beforeTo&&inWeek&&(selectedStatus==='all'||(item.status||'Present').toLowerCase()===selectedStatus)}).sort((a,b)=>b.date.localeCompare(a.date)).map(item=>{const total=duration(item.checkin,item.checkout);const overtime=Math.max(0,total-8);return `<tr><td>${formatDate(item.date)}</td><td>${esc(formatTime(item.checkin))}<small>${esc(item.checkin||'')}</small></td><td>${item.checkout?`${esc(formatTime(item.checkout))}<small>${esc(item.checkout)}</small>`:status('Active')}</td><td>${hours(total)}</td><td>${overtime?hours(overtime):'--'}</td><td>${status(item.status||'Present')}</td></tr>`}).join('')||'<tr><td class="empty" colspan="6">No attendance records match these filters.</td></tr>'}
function renderAttendance(mode='weekly',from='',to='',selectedStatus='all'){shell('Attendance','Your personal attendance history and working-time summary.',`<section class="panel"><div class="panel-head"><div><h2>Attendance history</h2><p>Standard shift: 8 hours · Only your records are shown.</p></div><div class="segmented"><button class="${mode==='daily'?'active':''}" data-attendance-mode="daily">Daily</button><button class="${mode==='weekly'?'active':''}" data-attendance-mode="weekly">Weekly</button></div></div><div class="attendance-top"><div class="attendance-state"><strong id="timer">00:00:00</strong><span>${clockedIn?'Currently working':'Ready to start your day'}</span></div><button class="attendance-btn ${clockedIn?'checkout':''}" id="clock">${clockedIn?'Check Out':'Check In'}</button></div><div class="filter-bar"><label>From <input id="attendance-from" type="date" value="${esc(from)}"></label><label>To <input id="attendance-to" type="date" value="${esc(to)}"></label><label>Status <select id="attendance-status"><option value="all" ${selectedStatus==='all'?'selected':''}>All statuses</option><option value="present" ${selectedStatus==='present'?'selected':''}>Present</option><option value="absent" ${selectedStatus==='absent'?'selected':''}>Absent</option><option value="half-day" ${selectedStatus==='half-day'?'selected':''}>Half-day</option><option value="leave" ${selectedStatus==='leave'?'selected':''}>Leave</option></select></label><button class="secondary" id="clear-attendance-filters">Clear filters</button></div><div class="table-wrap"><table class="data-table attendance-table"><thead><tr><th>Date</th><th>Check-in time</th><th>Check-out time</th><th>Working time</th><th>Extra time</th><th>Status</th></tr></thead><tbody id="attendance-body">${attendanceRows(mode,from,to,selectedStatus)}</tbody></table></div></section>`);links();document.getElementById('clock').onclick=toggleClock;document.querySelectorAll('[data-attendance-mode]').forEach(button=>button.onclick=()=>renderAttendance(button.dataset.attendanceMode,document.getElementById('attendance-from').value,document.getElementById('attendance-to').value,document.getElementById('attendance-status').value));const refresh=()=>{document.getElementById('attendance-body').innerHTML=attendanceRows(mode,document.getElementById('attendance-from').value,document.getElementById('attendance-to').value,document.getElementById('attendance-status').value)};document.getElementById('attendance-from').onchange=refresh;document.getElementById('attendance-to').onchange=refresh;document.getElementById('attendance-status').onchange=refresh;document.getElementById('clear-attendance-filters').onclick=()=>renderAttendance(mode);updateTimer()}
function renderLeave(){shell('Time off','Apply for leave and keep track of every request.',`<div class="section-grid"><section class="panel"><div class="panel-head"><div><h2>Apply for leave</h2><p>Your request will be sent to HR for review.</p></div></div><form class="leave-form" id="leave-form"><div class="form-row"><div class="form-field"><label>Leave type</label><select id="leave-type"><option>Paid</option><option>Sick</option><option>Unpaid</option></select></div><div class="form-field"><label>From</label><input id="from" type="date" required></div></div><div class="form-field"><label>To</label><input id="to" type="date" required></div><div class="form-field"><label>Remarks</label><textarea id="remarks" rows="4" placeholder="Add a note for your manager"></textarea></div><button class="primary" type="submit">Submit request</button><p class="message" id="leave-message"></p></form></section><section class="panel"><div class="panel-head"><div><h2>Request history</h2><p>All your time-off requests.</p></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Type</th><th>Dates</th><th>Status</th></tr></thead><tbody>${leaves.map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.from)} - ${esc(x.to)}</td><td>${status(x.status)}</td></tr>`).join('')||'<tr><td class="empty" colspan="3">No requests yet.</td></tr>'}</tbody></table></div></section></div>`);links();document.getElementById('leave-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/leave',{method:'POST',body:JSON.stringify({type:document.getElementById('leave-type').value,from:document.getElementById('from').value,to:document.getElementById('to').value,remarks:document.getElementById('remarks').value})});await load();renderLeave()}catch(_){document.getElementById('leave-message').textContent='Unable to submit request.'}}}
function renderPayroll(){shell('Payroll','A read-only view of your current salary structure.',`<section class="panel"><div class="panel-head"><div><h2>Salary overview</h2><p>Private information · Last updated this month</p></div><span class="status approved">Read-only</span></div><div class="salary-grid"><div class="salary-item"><span>Annual salary</span><strong>${profile.payroll?.currency||'USD'} ${Number(profile.payroll?.salary||0).toLocaleString()}</strong></div><div class="salary-item"><span>Payment frequency</span><strong>Monthly</strong></div><div class="salary-item"><span>Last payslip</span><strong>${esc(profile.payroll?.last_payslip||'Not available')}</strong></div></div></section>`);links()}
function renderProfile(){shell('My profile','Your personal and professional information.',`<section class="panel"><div class="profile-card"><span class="avatar">${esc(initials(profile.name))}</span><div><strong>${esc(profile.name)}</strong><span>${esc(profile.email)}</span><span>${esc(profile.phone||'Phone not added')}</span></div></div></section>`);links()}
async function toggleClock(){try{if(!clockedIn){await api('/api/attendance/checkin',{method:'POST'});clockedIn=true;clockStart=Date.now()}else{await api('/api/attendance/checkout',{method:'POST'});clockedIn=false;clockStart=null}await load();show('attendance')}catch(_){alert('Unable to update attendance')}}function updateTimer(){const el=document.getElementById('timer');if(el&&clockedIn&&clockStart){const s=Math.floor((Date.now()-clockStart)/1000);el.textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')}setTimeout(updateTimer,1000)}async function load(){try{profile=await api('/api/profile');attendance=await api('/api/attendance');leaves=await api('/api/leave');const active=attendance.find(x=>x.date===today.toISOString().slice(0,10)&&x.checkin&&!x.checkout);if(active){clockedIn=true;clockStart=Date.parse(active.checkin)}}catch(_){profile={name:'Alex Employee',email:'employee@dayflow.com',payroll:{salary:72000,currency:'USD'}}}document.getElementById('side-name').textContent=profile.name;document.getElementById('side-avatar').textContent=initials(profile.name)}function show(view){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('crumb').textContent={overview:'Overview',profile:'My profile',attendance:'Attendance',leave:'Time off',payroll:'Payroll'}[view]||'Overview';({overview:renderOverview,profile:renderProfile,attendance:renderAttendance,leave:renderLeave,payroll:renderPayroll}[view]||renderOverview)()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));document.getElementById('logout').onclick=()=>{document.cookie='session=; Path=/; Max-Age=0';location='/'};load().then(()=>show('overview'));
</script></body></html>
